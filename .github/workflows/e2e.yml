name: E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright (chromium)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: e2e
          POSTGRES_DB: lawallet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # provision-db.mjs derives lawallet_e2e from this and creates it.
      DATABASE_URL: postgresql://e2e:e2e@localhost:5432/lawallet
      # The seed encrypts the mock NWC URIs with this and the webServer's
      # boot migration decrypts them. Pinned at the job level so the seed
      # process and the Next.js webServer inherit the same value; e2e/env.ts
      # and provision-db.mjs read it too (falling back to this literal locally
      # so `pnpm e2e` needs no setup). Non-sensitive CI value, like ci.yml's
      # JWT_SECRET.
      NWC_VAULT_SECRET: ci-e2e-nwc-vault-secret-minimum-32-characters
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lawallet-nwc/web exec playwright install --with-deps chromium
      - run: pnpm --filter @lawallet-nwc/web e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/e2e-results/
          retention-days: 14

  bench:
    name: Benchmarks (observational)
    runs-on: ubuntu-latest
    # Never gates the PR — numbers are machine-dependent trends, uploaded as
    # an artifact for comparison.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lawallet-nwc/web bench
      - name: Upload bench results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-results
          path: apps/web/bench-results/latest.json
          retention-days: 30
