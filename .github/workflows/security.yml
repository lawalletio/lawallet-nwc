name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly on Monday at 06:00 UTC
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # Runs from the repo root on purpose. `pnpm audit` always resolves the
      # shared workspace lockfile, so a `working-directory` here would be a
      # no-op — it audits every workspace package either way, which is why
      # reported paths look like `apps__docs>next>sharp`. `--prod` drops
      # devDependencies but keeps optionalDependencies, so transitive optional
      # deps (next > sharp) stay in scope.
      # npm's audit POST is a large payload. GHA has been failing this job on
      # ERR_SOCKET_TIMEOUT against registry.npmjs.org/-/npm/v1/security/audits
      # even when there are no high findings (see PR #173 run 33834724585).
      # Retry only that class of registry/network errors; real highs fail fast.
      - name: Check for known vulnerabilities
        env:
          npm_config_fetch_retries: '8'
          npm_config_fetch_retry_mintimeout: '20000'
          npm_config_fetch_retry_maxtimeout: '120000'
          npm_config_fetch_timeout: '300000'
        run: |
          for i in 1 2 3 4 5; do
            set +e
            output="$(pnpm audit --prod --audit-level=high 2>&1)"
            status=$?
            set -e
            printf '%s\n' "$output"
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            if printf '%s\n' "$output" | grep -Eq 'ERR_SOCKET_TIMEOUT|ECONNRESET|EAI_AGAIN|503 Service|ENOTFOUND'; then
              echo "::warning::Transient npm audit API failure (attempt $i/5); retrying in 30s"
              sleep 30
              continue
            fi
            exit "$status"
          done
          exit 1
